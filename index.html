<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>3DM</title>
    <meta name="description" content="3DM — a GPU-raymarched Mandelbulb explorer." />
    <meta name="color-scheme" content="dark" />

    <!-- Trunk's built-in wasm-opt step fails against Homebrew's binaryen, so
         release size optimisation is done by ./build-release.sh instead. -->
    <link data-trunk rel="rust" data-wasm-opt="0" />

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #0a0d12;
            color: #c8ccd4;
            font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
        }

        /* eframe drives the canvas size; it just needs to fill the window. */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }

        #3dm_loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
            padding: 24px;
        }

        #3dm_loading .brand {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 0.12em;
            color: #e6e9ef;
        }

        #3dm_loading .err {
            color: #ff8a80;
            font-weight: 600;
        }

        #3dm_loading .err-detail {
            max-width: 52ch;
            color: #8d94a1;
            font-size: 13px;
        }

        /* The running diagnostic log. Deliberately just past the bottom of the
           viewport: it must stay part of the rendered document so it can be
           read as text, while never appearing over the picture. */
        #3dm_diag {
            position: absolute;
            top: 100%;
            left: 0;
            margin: 0;
            white-space: pre;
            font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
            color: #8d94a1;
        }

        /* Only ever created when something has actually gone wrong, so it can
           afford to cover the canvas — behind it there is nothing to see. */
        #3dm_error {
            position: absolute;
            inset: 0;
            z-index: 10;
            padding: 24px;
            overflow: auto;
            white-space: pre-wrap;
            background: rgba(10, 13, 18, 0.94);
            color: #ff8a80;
            font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        }
    </style>
</head>

<body>
    <canvas id="3dm_canvas"></canvas>
    <div id="3dm_loading">
        <div class="brand">3DM</div>
        <div>compiling shaders…</div>
    </div>
</body>

</html>
