[package]
name = "three_dm"
version = "0.1.0"
edition = "2024"
description = "3DM — a modern, GPU-raymarched Mandelbulb explorer for the web"
license = "GPL-3.0-or-later"
repository = "https://github.com/thepacket/3dm"

[workspace]
members = [".", "tools/mb2-transpile"]

[[bin]]
name = "3dm"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.35.0", default-features = false, features = [
    "default_fonts",
    "web_screen_reader",
    "wgpu",
] }
egui = "0.35.0"
log = "0.4.33"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
web-sys = { version = "0.3.103", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.11"

# The fractal is pure shader work, but the WASM bundle should still be small and
# the CPU-side math (camera, params) shouldn't be a debug-build bottleneck.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
# Note: do NOT set `strip = true` here — it produces a wasm that binaryen's
# validator rejects, so the wasm-opt pass in build-release.sh fails.

# Dev builds of the dependency tree (wgpu, egui) are painfully slow unoptimized.
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Pinned to the version wgpu bundles. A check against a different naga is
# not a check: two formulas passed naga 30 and failed on the GPU.
naga = { version = "29.0.4", features = ["wgsl-in"] }
pollster = "1.0.1"
