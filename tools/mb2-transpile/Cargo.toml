[package]
name = "mb2-transpile"
version = "0.1.0"
edition = "2024"
description = "Translates Mandelbulber2 OpenCL fractal formulas into 3DM's WGSL formula fragments"
license = "GPL-3.0-or-later"
publish = false

# Deliberately dependency-free: this is a source-to-source rewriter over a very
# regular corpus, and a hand-written scanner keeps the failure modes legible.
[dependencies]
# Pinned to the version wgpu bundles. A check against a different naga is
# not a check: two formulas passed naga 30 and failed on the GPU.
naga = { version = "29.0.4", features = ["wgsl-in"] }
